<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Service hatch</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
:root{--paper:#fff8ea;--ink:#3a2617;--ink2:#7c5a3e;--line:#3a2617;--gold:#ffd75e;--red:#d9452c;--green:#3f8f3a}
*{box-sizing:border-box}
body{margin:0;background:#bfe3f2;color:var(--ink);font:14px/1.45 system-ui,sans-serif;padding:20px 16px 40px}
main{max-width:860px;margin:0 auto;display:grid;gap:14px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header a{color:var(--ink2)}
h1{margin:0;font-size:24px}
h2{margin:0 0 8px;font-size:16px}
.tag{font:700 11px ui-monospace,monospace;padding:3px 8px;border:2px solid var(--line);border-radius:7px;background:#eee}
.tag.ok{background:#c9ecb0}.tag.warn{background:#ffe08a}.tag.bad{background:#ffd2c6}
section{background:var(--paper);border:2.5px solid var(--line);border-radius:14px;box-shadow:0 4px 0 rgba(58,38,23,.35);padding:14px 16px}
label{display:grid;gap:4px;font-weight:600;font-size:12px;margin:8px 0}
input{font:13px ui-monospace,monospace;padding:8px 10px;border:2px solid var(--line);border-radius:9px;background:#fff}
button{font:700 13px system-ui;padding:8px 14px;border:2.5px solid var(--line);border-radius:10px;background:var(--gold);cursor:pointer;box-shadow:0 3px 0 rgba(58,38,23,.4)}
.note{color:var(--ink2);font-size:12px;margin:6px 0 0}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0;font-size:13px}
dt{color:var(--ink2)}dd{margin:0;font-family:ui-monospace,monospace;word-break:break-all}
ol{margin:0;padding-left:0;list-style:none;font:12px/1.5 ui-monospace,monospace;max-height:360px;overflow:auto}
li.warn{color:#9a6200}li.error{color:var(--red)}li.success{color:var(--green)}
</style>
</head>
<body>
<main>
  <header><a href="/" id="back">← Back to town</a><h1>Service hatch</h1><span class="tag" id="lamp">CONNECTING</span></header>
  <section><h2>Settings</h2>
    <p class="note">Saved on the engine, not in this browser. Leave a field empty to keep what is set. Every save needs ADMIN_SECRET from the server's .env.</p>
    <dl id="now"></dl>
    <form id="save" autocomplete="off">
      <label>Token address<input id="f-token" placeholder="0x…" spellcheck="false" autocomplete="off"></label>
      <label>Treasury address<input id="f-treasury" placeholder="0x…" spellcheck="false" autocomplete="off"></label>
      <label>Operator private key<input id="f-key" type="password" placeholder="leave empty to keep the current key" spellcheck="false" autocomplete="new-password"></label>
      <label>Admin secret<input id="f-secret" type="password" placeholder="ADMIN_SECRET from the server" spellcheck="false" autocomplete="off"></label>
      <button type="submit">Save to engine</button>
      <p class="note" id="note" role="status"></p>
    </form>
  </section>
  <section><h2>Engine</h2><dl id="stats"></dl></section>
  <section><h2>Engine log</h2><ol id="log"></ol></section>
</main>
<script type="module">
const EXPLORER = 'https://explorer.mainnet.chain.robinhood.com';
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const short = (a) => (a ? a.slice(0, 6) + '…' + a.slice(-4) : '');
const link = (a, none) => (a ? `<a href="${EXPLORER}/address/${a}" target="_blank" rel="noreferrer">${short(a)}</a>` : `<em>${none}</em>`);
const isAddr = (v) => /^0x[0-9a-fA-F]{40}$/.test(v.trim());
const isKey = (v) => /^(0x)?[0-9a-fA-F]{64}$/.test(v.trim());
async function load() {
  try {
    const j = await (await fetch('/api/status', { cache: 'no-store' })).json(); const s = j.data; document.title = s.townName + ' · service hatch'; $('back').textContent = '← ' + s.townName;
    const ok = s.tokenAddress && s.walletAddress && s.treasuryAddress;
    $('lamp').textContent = s.status.toUpperCase(); $('lamp').className = 'tag ' + (s.status === 'error' ? 'bad' : ok ? 'ok' : 'warn');
    $('now').innerHTML = `<dt>Token</dt><dd>${link(s.tokenAddress, 'not set')}</dd><dt>Curve</dt><dd>${link(s.curveAddress, 'found after the token is set')}</dd><dt>Treasury</dt><dd>${link(s.treasuryAddress, 'not set')}</dd><dt>Operator</dt><dd>${link(s.walletAddress, 'no key yet')}</dd>`;
    $('stats').innerHTML = `<dt>Citizens</dt><dd>${s.counts.citizens}</dd><dt>Sold and left</dt><dd>${s.counts.out}</dd><dt>Fee escrow</dt><dd>${s.escrowETH} ETH</dd><dt>Next round</dt><dd>at ${s.round.thresholdETH} ETH · ${s.round.burnPct}% burn · ${s.round.rewardPct}% top ${s.round.topN} · ${s.round.treasuryPct}% treasury</dd><dt>Bought back</dt><dd>${s.totals.burnETH} ETH</dd><dt>Burned</dt><dd>${(+s.totals.tokensBurned).toLocaleString('en-US')} ${s.ticker}</dd><dt>Shared with the top ${s.round.topN}</dt><dd>${(+s.totals.tokensShared).toLocaleString('en-US')} ${s.ticker}</dd><dt>To the treasury</dt><dd>${s.totals.keeperETH} ETH</dd><dt>Rounds done</dt><dd>${s.rounds}</dd><dt>Price</dt><dd>${s.price.tokenUSD ? '$' + s.price.tokenUSD.toPrecision(3) + ' (' + s.price.source + ')' : '–'}</dd><dt>Last block</dt><dd>${s.lastIndexedBlock}</dd>`;
    $('log').innerHTML = (s.logs || []).map((l) => `<li class="${l.type}">${new Date(l.t * 1000).toLocaleTimeString()} · ${esc(l.msg)}</li>`).join('');
  } catch (e) { $('lamp').textContent = 'OFFLINE'; $('lamp').className = 'tag bad'; }
}
$('save').onsubmit = async (e) => {
  e.preventDefault();
  const tokenAddress = $('f-token').value.trim(), treasuryAddress = $('f-treasury').value.trim(), privateKey = $('f-key').value.trim(), secret = $('f-secret').value.trim();
  if (tokenAddress && !isAddr(tokenAddress)) return ($('note').textContent = 'The token address is not an address.');
  if (treasuryAddress && !isAddr(treasuryAddress)) return ($('note').textContent = 'The treasury address is not an address.');
  if (privateKey && !isKey(privateKey)) return ($('note').textContent = 'That is not a private key (64 hex characters).');
  if (!secret) return ($('note').textContent = 'Paste the admin secret.');
  $('note').textContent = 'Saving…';
  try {
    const r = await (await fetch('/api/admin/save', { method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-secret': secret }, body: JSON.stringify({ tokenAddress, treasuryAddress, privateKey }) })).json();
    $('note').textContent = r.success ? 'Saved.' : r.error || 'Not saved.';
    if (r.success) { $('f-key').value = ''; $('f-token').value = ''; $('f-treasury').value = ''; }
  } catch (e) { $('note').textContent = 'The engine did not answer.'; }
  load();
};
load(); setInterval(load, 5000);
</script>
</body>
</html>
